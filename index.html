<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Event</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#172033;font-family:system-ui,sans-serif}
header{background:#fff;padding:14px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:20px}
small{color:#667085}
nav{display:flex;gap:6px;padding:10px;position:sticky;top:59px;background:#f4f7fb;z-index:4}
button{border:1px solid #dce3eb;background:#fff;border-radius:9px;padding:9px;cursor:pointer}
nav button.active{background:#0b6e69;color:#fff}
main{max-width:1100px;margin:auto;padding:0 10px 30px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card,.eq,.stat{background:#fff;border:1px solid #e3e8ef;border-radius:13px;padding:12px;margin-bottom:10px}
.stat b{display:block;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.name{font-weight:800}.type{font-size:11px;color:#667085}
.current{background:#f1f5f9;border-radius:8px;padding:8px;margin:8px 0;font-size:13px}
.statuses{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.statuses button{font-size:11px;text-align:left}
.statuses button.active{background:#e6f5f3;border-color:#0b6e69;font-weight:700}
.operator-row{display:flex;gap:7px;align-items:center;margin:8px 0}
.operator-row input{flex:1}
.status-trigger{width:100%;text-align:left;font-weight:700;margin:8px 0}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal-backdrop.open{display:flex}
.modal{background:#fff;width:min(650px,100%);max-height:85vh;border-radius:18px 18px 0 0;padding:16px;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal-title{font-size:18px;font-weight:800}
.modal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.modal-grid button{text-align:left;padding:12px}
.modal-grid button.active{background:#e6f5f3;border-color:#0b6e69;font-weight:700}
.log{display:grid;grid-template-columns:90px 110px 120px 1fr;gap:7px;padding:8px 0;border-bottom:1px solid #eee;font-size:12px}
select,input{width:100%;padding:10px;border:1px solid #d8e0e8;border-radius:9px;font:inherit}
.primary{background:#0b6e69;color:#fff;border:0;font-weight:700}
#msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:20}
.err{background:#fff1f1;border:1px solid #ffb4b4;padding:12px;border-radius:10px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.log{grid-template-columns:75px 85px 90px 1fr}.modal-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>⛏ Data Event</h1>
<small>Supabase database-тэй холбогдсон</small>
</header>

<nav>
<button class="active" data-page="dash">Dashboard</button>
<button data-page="eq">Equipment</button>
<button data-page="hour">Цагийн мэдээ</button>
</nav>

<main>
<section id="dash"></section>
<section id="eq" style="display:none"></section>
<section id="hour" style="display:none"></section>
</main>
<div id="msg"></div>
<div id="statusModal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Төлөв сонгох</div>
      <button id="closeModal">✕</button>
    </div>
    <div class="modal-grid" id="modalStatuses"></div>
  </div>
</div>

<script>
"use strict";

const API_URL = "https://vchffwfkqcscyjwjrwge.supabase.co";
const API_KEY = "sb_publishable_sxW6qob3dT2O1vrCTBxZVw_6zs5HZTN";

let equipment = [];
let statuses = [];
let events = [];

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function fmt(value) {
  if (!value) return "";
  return new Date(value).toLocaleString("mn-MN", {
    day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"
  });
}

function toast(message) {
  const box = document.getElementById("msg");
  box.textContent = message;
  box.style.display = "block";
  setTimeout(function(){ box.style.display = "none"; }, 2200);
}

async function api(path, options) {
  const opts = options || {};
  const headers = Object.assign({
    "apikey": API_KEY,
    "Authorization": "Bearer " + API_KEY,
    "Content-Type": "application/json"
  }, opts.headers || {});
  const response = await fetch(API_URL + "/rest/v1/" + path, Object.assign({}, opts, {headers}));
  const text = await response.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) { data = text; }
  if (!response.ok) {
    throw new Error((data && data.message) || text || ("HTTP " + response.status));
  }
  return data;
}

async function loadData() {
  try {
    equipment = await api("equipment?select=*&order=name");
    const statusRows = await api("status_types?select=name&order=id");
    statuses = statusRows.map(function(row){ return row.name; });

    try {
      events = await api("equipment_events?select=equipment_id,status,start_time,end_time,operator_name&order=start_time.desc&limit=1000");
    } catch (_) {
      events = [];
    }

    render();
  } catch (error) {
    const message = '<div class="err"><b>Supabase уншихад алдаа гарлаа.</b><br>' +
      esc(error.message) + '</div>';
    document.getElementById("dash").innerHTML = message;
    document.getElementById("eq").innerHTML = message;
  }
}

const EXTRA_STATUSES = [
  "Хорших Текник бусад ажил",
  "Хүлээлт",
  "Хорших Текник шилжсэн",
  "Оператор тойрох үзлэг",
  "Маркшейдераас шалтгаалсан зогсолт",
  "Геологи шалтгаалсан зогсолт",
  "Тос тосолгоо",
  "Тос тослох материал",
  "Экскаватор төлөвлөгөөт засварт зогссон"
];

function getOperators() {
  try { return JSON.parse(localStorage.getItem("data_event_operators") || "{}"); }
  catch (_) { return {}; }
}

function getOperator(equipmentId) {
  const operators = getOperators();
  return String(operators[equipmentId] || "").trim();
}

function saveOperator(equipmentId, value) {
  const operators = getOperators();
  const name = String(value || "").trim();
  if (name) operators[equipmentId] = name;
  else delete operators[equipmentId];
  localStorage.setItem("data_event_operators", JSON.stringify(operators));
}

function clearOperator(equipmentId) {
  saveOperator(equipmentId, "");
  const input = document.querySelector('[data-operator-id="' + CSS.escape(String(equipmentId)) + '"]');
  if (input) input.value = "";
}

function allStatuses() {
  return Array.from(new Set(statuses.concat(EXTRA_STATUSES)));
}

let selectedEquipmentId = null;

function openStatusModal(equipmentId) {
  const item = equipment.find(function(x){ return String(x.id) === String(equipmentId); });
  if (!item) return;
  selectedEquipmentId = equipmentId;
  document.getElementById("modalTitle").textContent = item.name + " — Төлөв сонгох";
  document.getElementById("modalStatuses").innerHTML = allStatuses().map(function(status){
    return '<button class="' + (item.current_status === status ? "active" : "") + '" data-modal-status="' + esc(status) + '">' + esc(status) + '</button>';
  }).join("");
  document.getElementById("statusModal").classList.add("open");
}

function closeStatusModal() {
  selectedEquipmentId = null;
  document.getElementById("statusModal").classList.remove("open");
}


async function setStatus(equipmentId, status) {
  const item = equipment.find(function(x){ return String(x.id) === String(equipmentId); });
  if (!item) {
    toast("Техник олдсонгүй.");
    return;
  }

  const operator = getOperator(equipmentId);
  if (!operator) {
    toast("Эхлээд энэ техникийн операторыг оруулна уу.");
    const input = document.querySelector('[data-operator-id="' + CSS.escape(String(equipmentId)) + '"]');
    if (input) input.focus();
    return;
  }

  const now = new Date().toISOString();

  try {
    await api(
      "equipment_events?equipment_id=eq." + encodeURIComponent(equipmentId) + "&end_time=is.null",
      {
        method:"PATCH",
        body:JSON.stringify({end_time:now})
      }
    );

    await api("equipment_events", {
      method:"POST",
      headers:{"Prefer":"return=minimal"},
      body:JSON.stringify({
        equipment_id:equipmentId,
        status:status,
        start_time:now,
        operator_name:operator
      })
    });

    await api("equipment?id=eq." + encodeURIComponent(equipmentId), {
      method:"PATCH",
      headers:{"Prefer":"return=minimal"},
      body:JSON.stringify({current_status:status})
    });

    toast(item.name + " → " + status);
    await loadData();
  } catch (error) {
    toast("Хадгалах алдаа: " + error.message);
  }
}

function showPage(page) {
  ["dash","eq","hour"].forEach(function(id) {
    document.getElementById(id).style.display = id === page ? "block" : "none";
  });
  document.querySelectorAll("nav button").forEach(function(button) {
    button.classList.toggle("active", button.dataset.page === page);
  });
  if (page === "hour") renderHour();
}

function render() {
  const workingStatuses = ["Хүдэр олборлолт","Хөрс хуулалт","Ажиллаж байна"];
  const working = equipment.filter(function(x){ return workingStatuses.includes(x.current_status); }).length;
  const ore = equipment.filter(function(x){ return x.current_status === "Хүдэр олборлолт"; }).length;
  const waste = equipment.filter(function(x){ return x.current_status === "Хөрс хуулалт"; }).length;

  document.getElementById("dash").innerHTML =
    '<div class="stats">' +
      '<div class="stat">Нийт техник<b>' + equipment.length + '</b></div>' +
      '<div class="stat">Ажиллаж буй<b>' + working + '</b></div>' +
      '<div class="stat">Хүдэр<b>' + ore + '</b></div>' +
      '<div class="stat">Хөрс<b>' + waste + '</b></div>' +
    '</div>' +
    '<div class="card"><b>Одоогийн төлөв</b>' +
    equipment.map(function(x) {
      return '<div class="log">' +
        '<b>' + esc(x.name) + '</b>' +
        '<span>' + esc(getOperator(x.id) || "-") + '</span>' +
        '<span>' + esc(x.current_status || "Нөөцөнд зогссон") + '</span>' +
        '<span>' + fmt(x.updated_at || x.created_at) + '</span>' +
      '</div>';
    }).join("") +
    '</div>';

  document.getElementById("eq").innerHTML =
    '<div class="card"><b>Техник бүрийн оператор</b><br><small>Операторыг техник бүр дээр тусад нь хадгална.</small></div>' +
    '<div class="grid">' +
    equipment.map(function(x) {
      const operator = getOperator(x.id);
      return '<div class="eq">' +
        '<div class="name">' + esc(x.name) + '</div>' +
        '<div class="type">' + esc(x.equipment_type) + '</div>' +
        '<div class="operator-row">' +
          '<input data-operator-id="' + esc(x.id) + '" value="' + esc(operator) + '" placeholder="Операторын нэр">' +
          '<button data-clear-operator-id="' + esc(x.id) + '">Цэвэрлэх</button>' +
        '</div>' +
        '<div class="current"><small>Одоогийн төлөв</small><br><b>' + esc(x.current_status || "Нөөцөнд зогссон") + '</b></div>' +
        '<button class="status-trigger" data-open-status="' + esc(x.id) + '">Төлөв сонгох ▾</button>' +
      '</div>';
    }).join("") +
    '</div>';

  renderHour();
}

function renderHour() {
  const selected = document.getElementById("hourSelect");
  const hour = selected ? Number(selected.value) : new Date().getHours();

  const list = events.filter(function(event) {
    return new Date(event.start_time).getHours() === hour;
  });

  document.getElementById("hour").innerHTML =
    '<div class="card">' +
      '<b>Цагийн мэдээ</b><br>' +
      '<button class="primary" id="exportHour" style="margin:8px 0">📊 Excel татах</button>' +
      '<button id="exportAll" style="margin:8px 0 8px 6px">Бүх мэдээ</button>' +
      '<select id="hourSelect">' +
        Array.from({length:24}, function(_, i) {
          return '<option value="' + i + '"' + (i === hour ? " selected" : "") + '>' +
            String(i).padStart(2,"0") + ':00 – ' + String((i+1)%24).padStart(2,"0") + ':00</option>';
        }).join("") +
      '</select>' +
    '</div>' +
    '<div class="card">' +
      (list.length ? list.map(function(event) {
        const item = equipment.find(function(x){ return String(x.id) === String(event.equipment_id); });
        return '<div class="log">' +
          '<b>' + fmt(event.start_time) + '</b>' +
          '<span>' + esc(item ? item.name : event.equipment_id) + '</span>' +
          '<span>' + esc(event.operator_name || getOperator(event.equipment_id) || "-") + '</span>' +
          '<span>' + esc(event.status) + '</span>' +
        '</div>';
      }).join("") : "Энэ цагт event алга.") +
    '</div>';
}

function exportHour() {
  if (typeof XLSX === "undefined") {
    toast("Excel модуль ачаалагдаагүй байна.");
    return;
  }
  const select = document.getElementById("hourSelect");
  const hour = select ? Number(select.value) : new Date().getHours();

  const rows = events.filter(function(event) {
    return new Date(event.start_time).getHours() === hour;
  }).map(function(event) {
    const item = equipment.find(function(x){ return String(x.id) === String(event.equipment_id); });
    return {
      "Огноо":new Date(event.start_time).toLocaleDateString("mn-MN"),
      "Цаг":new Date(event.start_time).toLocaleTimeString("mn-MN",{hour:"2-digit",minute:"2-digit"}),
      "Техник":item ? item.name : event.equipment_id,
      "Техникийн төрөл":item ? item.equipment_type : "",
      "Төлөв":event.status,
      "Оператор":event.operator_name || ""
    };
  });

  const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{"Мэдээлэл":"Сонгосон цагт event байхгүй"}]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Цагийн мэдээ");
  XLSX.writeFile(wb, "Data_Event_" + String(hour).padStart(2,"0") + "00.xlsx");
}

function exportAll() {
  if (typeof XLSX === "undefined") {
    toast("Excel модуль ачаалагдаагүй байна.");
    return;
  }

  const rows = events.map(function(event) {
    const item = equipment.find(function(x){ return String(x.id) === String(event.equipment_id); });
    return {
      "Огноо":new Date(event.start_time).toLocaleDateString("mn-MN"),
      "Эхэлсэн цаг":new Date(event.start_time).toLocaleString("mn-MN"),
      "Дууссан цаг":event.end_time ? new Date(event.end_time).toLocaleString("mn-MN") : "",
      "Техник":item ? item.name : event.equipment_id,
      "Техникийн төрөл":item ? item.equipment_type : "",
      "Төлөв":event.status,
      "Оператор":event.operator_name || ""
    };
  });

  const current = equipment.map(function(item) {
    return {
      "Техник":item.name,
      "Техникийн төрөл":item.equipment_type || "",
      "Одоогийн төлөв":item.current_status || "Нөөцөнд зогссон"
    };
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Бүх мэдээ");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(current), "Одоогийн төлөв");
  XLSX.writeFile(wb, "Data_Event_Buh_Medee.xlsx");
}

document.addEventListener("click", function(event) {
  const pageButton = event.target.closest("nav button[data-page]");
  if (pageButton) {
    showPage(pageButton.dataset.page);
    return;
  }

  const openButton = event.target.closest("[data-open-status]");
  if (openButton) {
    openStatusModal(openButton.dataset.openStatus);
    return;
  }

  const modalStatus = event.target.closest("[data-modal-status]");
  if (modalStatus && selectedEquipmentId !== null) {
    const equipmentId = selectedEquipmentId;
    const status = modalStatus.dataset.modalStatus;
    closeStatusModal();
    setStatus(equipmentId, status);
    return;
  }

  const clearButton = event.target.closest("[data-clear-operator-id]");
  if (clearButton) {
    clearOperator(clearButton.dataset.clearOperatorId);
    render();
    showPage("eq");
    return;
  }

  if (event.target.id === "closeModal" || event.target.id === "statusModal") {
    closeStatusModal();
    return;
  }

  if (event.target.id === "exportHour") {
    exportHour();
    return;
  }

  if (event.target.id === "exportAll") {
    exportAll();
  }
});

document.addEventListener("input", function(event) {
  if (event.target.matches("[data-operator-id]")) saveOperator(event.target.dataset.operatorId, event.target.value);
});

document.addEventListener("change", function(event) {
  if (event.target.id === "hourSelect") renderHour();
});

loadData();
</script>
</body>
</html>
